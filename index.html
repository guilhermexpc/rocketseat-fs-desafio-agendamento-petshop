<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Document</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400..700&family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/index.css" />
  </head>
  <body>
    <div id="logo">
      <img src="/src/assets/icons/logo.svg" alt="Logo Doguinho" />
      <span>Mundo Pet</span>
    </div>
    <header class="container">
      <h1>Sua agenda</h1>
      <p>Aqui você pode ver todos os clientes e serviços agendados para hoje.</p>
      <div class="calendar">
        <img src="src/assets/icons/calendar-minimalistic.svg" alt="" />
        <input type="date" id="date" class="date" />
      </div>
    </header>
    <main class="container">
      <div class="cards">
        <div class="card-item">
          <div class="card-header">
            <img src="src/assets/icons/sun-set.svg" alt="" />
            <span class="period-title">Manhã</span>
            <span class="period-time">09h-12h</span>
          </div>
          <div class="separator"></div>
          <div class="card-content">
            <span class="schedule-time">09:00</span>
            <span class="pet-name">Thor</span>
            <span class="owner-name">/ Fernanda costa</span>
            <p class="schedule-description">Vacinação</p>
            <button class="card-btn-delete">Remover agendamento</button>
          </div>
        </div>

        <div class="card-item">
          <div class="card-header">
            <img src="src/assets/icons/sun-set.svg" alt="" />
            <span class="period-title">Tarde</span>
            <span class="period-time">09h-12h</span>
          </div>
          <div class="separator"></div>
          <div class="card-content">
            <span class="schedule-time">09:00</span>
            <span class="pet-name">Thor</span>
            <span class="owner-name">/ Fernanda costa</span>
            <p class="schedule-description">Vacinação</p>
            <button class="card-btn-delete">Remover agendamento</button>
          </div>
          <div class="separator-internal-container">
            <div class="separator"></div>
          </div>

          <div class="card-content">
            <span class="schedule-time">09:00</span>
            <span class="pet-name">Thor</span>
            <span class="owner-name">/ Fernanda costa</span>
            <p class="schedule-description">Vacinação</p>
            <button class="card-btn-delete">Remover agendamento</button>
          </div>

          <div class="card-content">
            <span class="schedule-time">09:00</span>
            <span class="pet-name">Thor</span>
            <span class="owner-name">/ Fernanda costa</span>
            <p class="schedule-description">Vacinação</p>
            <button class="card-btn-delete">Remover agendamento</button>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <button class="btn-schedule">Novo Agendamento</button>
      <div class="schedule-buttton"></div>
    </footer>
  </body>
</html>
